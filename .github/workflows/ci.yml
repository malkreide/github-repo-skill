name: CI

on:
  push:
    branches: [main, master]   # E5: Default-Branch ist nicht immer 'main'
  pull_request:
  workflow_dispatch:

# B5: ohne diesen Block gilt der Repo-Default, der auch 'read and write' sein
# kann. Dieser Workflow liest nur.
permissions:
  contents: read

# B6: ein neuer Push auf denselben PR macht den laufenden Job wertlos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10                       # B6
    steps:
      # B4: SHA statt Tag. Tags sind verschiebbar; genau das war der
      # tj-actions/changed-files-Vektor im Maerz 2025.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # 8.1: EXAKT gepinnt, nicht nur mit Obergrenze. Für `ruff check` genügt
      # die Obergrenze, weil der Regelsatz in ruff.toml steht. `ruff format`
      # hat kein `select` — dort ist das Ergebnis selbst das Kriterium, und
      # jede Version, die am Formatter etwas ändert, macht unberührten Code
      # rot. Die Version steht in requirements-lint.txt und nur dort — dieselbe
      # Form, die assets/workflows/ci.yml den Zielrepos vorgibt.
      - name: Install tooling
        run: python -m pip install -r requirements-lint.txt

      # 8.1: Pin gegen das laufende Programm, vor den Gates. Identisch mit dem
      # Schritt in assets/workflows/ci.yml.
      - name: Ruff version gate
        run: |
          want=$(sed -n 's/^ruff==\([0-9][0-9.]*\)[[:space:]]*$/\1/p' requirements-lint.txt)
          have=$(ruff --version | awk '{print $2}')
          if [ -z "$want" ]; then
            echo "::error::requirements-lint.txt pinnt ruff nicht exakt (erwartet: ruff==X.Y.Z)"
            exit 1
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::Pin ruff==$want, aber es läuft ruff $have"
            exit 1
          fi
          echo "ruff $have = Pin"

      # Regelsatz steht explizit in ruff.toml. Dieses Repo ist kein
      # Python-Paket und hat keine Subprojekte — die Schleife aus
      # assets/workflows/ci.yml entfällt hier bewusst.
      - name: Lint scripts
        run: ruff check scripts/

      # Zweites, eigenstaendiges Gate. Ein gruenes `ruff check` belegt kein
      # gruenes Format — dieser Fehlschluss hat in einem Schwester-Repo einen
      # Push rot gemacht, der lokal geprueft schien. Eigener Schritt, damit im
      # Log steht, welches der beiden Gates ausgeloest hat.
      - name: Format gate
        run: ruff format --check scripts/

      # Der Skill prüft sein eigenes Repo mit dem eigenen Validator.
      - name: Validate repository structure
        run: python scripts/validate_repo.py .

      # Zuerst gegen das EINGECHECKTE Archiv, und zwar vor dem Build — genau
      # das ist die Prüfung. Ein Lauf nach dem Build vergliche das Archiv mit
      # den Quellen, aus denen es soeben entstanden ist, und wäre immer grün.
      - name: Skill package matches the sources
        run: python scripts/validate_skill.py

      # Erst danach der Build selbst. Er wird sonst nirgends ausgeführt und
      # könnte unbemerkt kaputtgehen; die zweite Validierung belegt, dass sein
      # Ergebnis dieselben Prüfungen besteht. Byte-Vergleich bewusst nicht:
      # das Archiv ist reproduzierbar, aber eine andere `zip`-Version auf dem
      # Runner würde die CI ohne Codeänderung rot machen — Regel 8.1 in grün.
      - name: Build script still produces a valid package
        run: |
          ./scripts/build_skill.sh
          python scripts/validate_skill.py

      # C8 im Validator meldet abweichende Versionsanker als WARN — portfolioweit
      # richtig, denn eine veraltete Angabe ist ein Doku-Mangel und kein Baufehler.
      # Für dieses Repo reicht das nicht: Es ist die Quelle der Regel, und beim
      # v1.2.0-Release mussten drei Anker von Hand gezogen werden, weil nichts sie
      # zusammenhielt. Hier wird C8 deshalb zum Fehlschlag hochgestuft — eine
      # Implementation, zwei Schweregrade.
      #
      # Früher las ein Python-Heredoc dafür den JSON-Bericht ein zweites Mal.
      # Das ist genau die Form, die SKILL.md 8.7 verbietet: ein Urteil, das nur
      # auf dem Runner läuft, mit einem zweiten Leser des Berichtsschemas. Die
      # Hochstufung steckt jetzt im Validator selbst (`--fail-on`).
      - name: Version anchors are enforced here (C8 as an error)
        env:
          PYTHONUTF8: "1"
        run: python scripts/validate_repo.py --fail-on=C8 .
