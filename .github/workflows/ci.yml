name: CI

on:
  push:
    branches: [main, master]   # E5: Default-Branch ist nicht immer 'main'
  pull_request:
  workflow_dispatch:

# B5: ohne diesen Block gilt der Repo-Default, der auch 'read and write' sein
# kann. Dieser Workflow liest nur.
permissions:
  contents: read

# B6: ein neuer Push auf denselben PR macht den laufenden Job wertlos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10                       # B6
    steps:
      # B4: SHA statt Tag. Tags sind verschiebbar; genau das war der
      # tj-actions/changed-files-Vektor im Maerz 2025.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # 8.1: Version mit Obergrenze pinnen. Ohne Obergrenze zieht CI die
      # jeweils neuste ruff-Version und wird ohne Codeänderung rot.
      - name: Install tooling
        run: python -m pip install "ruff>=0.6,<0.7"

      # Regelsatz steht explizit in ruff.toml. Dieses Repo ist kein
      # Python-Paket und hat keine Subprojekte — die Schleife aus
      # assets/workflows/ci.yml entfällt hier bewusst.
      - name: Lint scripts
        run: ruff check scripts/

      # Der Skill prüft sein eigenes Repo mit dem eigenen Validator.
      - name: Validate repository structure
        run: python scripts/validate_repo.py .

      # C8 im Validator meldet abweichende Versionsanker als WARN — portfolioweit
      # richtig, denn eine veraltete Angabe ist ein Doku-Mangel und kein Baufehler.
      # Für dieses Repo reicht das nicht: Es ist die Quelle der Regel, und beim
      # v1.2.0-Release mussten drei Anker von Hand gezogen werden, weil nichts sie
      # zusammenhielt. Hier wird C8 deshalb zum Fehlschlag hochgestuft — eine
      # Implementation, zwei Schweregrade.
      - name: Version anchors are enforced here (C8 as an error)
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import json, subprocess, sys

          out = subprocess.run(
              [sys.executable, "scripts/validate_repo.py", "--json", "."],
              capture_output=True, text=True, encoding="utf-8", check=False,
          ).stdout
          findings = [i for i in json.loads(out) if i["rule"] == "C8"]
          for item in findings:
              print(f"{item['level']}: {item['message']}")
          if any(i["level"] != "INFO" for i in findings):
              sys.exit("C8 ist in diesem Repo blockierend — Versionsanker nachziehen")
          print("ok — Versionsanker stimmen mit dem CHANGELOG überein")
          PY
