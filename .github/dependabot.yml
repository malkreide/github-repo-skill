# B4 macht Pinning erst tragfaehig: gepinnte SHAs frieren sonst auf dem Stand
# des Tages ein, an dem das Repo entstand. Dependabot zieht Hash UND
# Versionskommentar gemeinsam nach, sodass die Zeile lesbar bleibt.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Ein PR pro Monat fuer alle Actions statt einer pro Action. Bei vielen
    # Repos ist die Zahl der PRs das eigentliche Problem, nicht ihr Inhalt:
    # was einzeln aufschlaegt, wird nicht gelesen, sondern weggeklickt.
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # SKILL.md 8.1: der ruff-Pin lebt in requirements-lint.txt. Der Bump kommt
  # als PR, dessen CI (Versions- und Format-Gate) ihn misst.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: ruff
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(dev)"
