name: CI

on:
  push:
    branches: [main, master]   # E5: Default-Branch ist nicht immer 'main'
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # B1: Version mit Obergrenze pinnen. Ohne Obergrenze zieht CI die
      # jeweils neuste ruff-Version und wird ohne Codeänderung rot.
      - name: Install tooling
        run: python -m pip install "ruff>=0.6,<0.7" pytest

      # B2: Subprojekte erben die Wurzelkonfiguration NICHT. ruff im
      # Wurzelverzeichnis aufzurufen genügt nicht, wenn Unterverzeichnisse
      # eigene pyproject.toml mit eigenem [tool.ruff]-Block haben.
      - name: Lint
        run: |
          ruff check .
          for sub in $(find . -mindepth 2 -name pyproject.toml -not -path "./.venv/*"); do
            echo "→ Lint $(dirname "$sub")"
            (cd "$(dirname "$sub")" && ruff check .)
          done

      - name: Test
        run: pytest -q

      # Struktur- und Dokumentationsprüfung (C-, B-, E-Regeln).
      - name: Validate repository structure
        run: python scripts/validate_repo.py .
